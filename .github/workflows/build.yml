name: build

# Controls when the action will run
on:

  # Trigger the workflow on all pushes, except on tag creation
  push:
    branches:
    - '**'
    tags-ignore:
    - '**'

  # Trigger the workflow on all pull requests
  pull_request: ~

  # Allow workflow to be dispatched on demand
  workflow_dispatch: ~

env:
  ATLAS_TOOLS: ${{ github.workspace }}/tools
  CTEST_PARALLEL_LEVEL: 1
  CACHE_SUFFIX: v1

jobs:
  ci:
    name: ci

    strategy:
      fail-fast: false  # false: try to complete all jobs

      matrix:
        build_type: [Debug]
        name:
          - linux intel

        include:

          - name : linux intel
            os: ubuntu-20.04
            compiler: intel-oneapi
            compiler_cc: icc
            compiler_cxx: icpc
            compiler_fc: ifort

    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v2

    - name: Environment
      run:  |
        echo "CC=${{ matrix.compiler_cc }}"     >> $GITHUB_ENV
        echo "CXX=${{ matrix.compiler_cxx }}"   >> $GITHUB_ENV
        echo "FC=${{ matrix.compiler_fc }}"     >> $GITHUB_ENV

        printenv


    - name: Install Intel oneAPI compiler
      if: contains( matrix.compiler, 'intel' )
      run: |
        ${ATLAS_TOOLS}/install-intel-oneapi.sh
        source /opt/intel/oneapi/setvars.sh
        printenv >> $GITHUB_ENV
        
        printenv

    - name: Set Build & Test Environment
      run: |
        set -x
        ls -l /opt/intel/oneapi
        ls -l /opt/intel/oneapi/compiler/
        ls -l /opt/intel/oneapi/compiler/2023.2.2
        ls -l /opt/intel/oneapi/compiler/2023.2.2/linux
        ls -l /opt/intel/oneapi/compiler/2023.2.2/linux/bin
        ls -l /opt/intel/oneapi/compiler/2023.2.2/linux/bin/intel64
        which icx
        which icc
        which icpc
        which ifx

