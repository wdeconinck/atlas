name: build

# Controls when the action will run
on:

  # Trigger the workflow on all pushes, except on tag creation
  push:
    branches:
    - '**'
    tags-ignore:
    - '**'

  # Trigger the workflow on all pull requests
  pull_request: ~

  # Allow workflow to be dispatched on demand
  workflow_dispatch: ~

env:
  ATLAS_TOOLS: ${{ github.workspace }}/tools
  CTEST_PARALLEL_LEVEL: 1
  CACHE_SUFFIX: v1

jobs:
  ci:
    name: ci

    strategy:
      fail-fast: false  # false: try to complete all jobs

      matrix:
        build_type: [Debug]
        name:
          - linux intel classic
          - linux intel

        include:

          - name : linux intel classic
            os: ubuntu-latest
            compiler: intel-classic
            compiler_version: 2021.10
            compiler_cc: icc
            compiler_cxx: icpc
            compiler_fc: ifort

          - name : linux intel
            os: ubuntu-latest
            compiler: intel
            compiler_version: 2023.2
            compiler_cc: icx
            compiler_cxx: icpx
            compiler_fc: ifx


    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v2

    - name: Environment
      run:  |
        echo "CC=${{ matrix.compiler_cc }}"     >> $GITHUB_ENV
        echo "CXX=${{ matrix.compiler_cxx }}"   >> $GITHUB_ENV
        #echo "FC=${{ matrix.compiler_fc }}"     >> $GITHUB_ENV

        printenv

    - name: Setup Fortran compiler
      if: contains(matrix.compiler, 'intel')
      uses: fortran-lang/setup-fortran@v1
      id: setup-fortran
      with:
        compiler: ${{ matrix.compiler }}
        version: ${{ matrix.compiler_version }}

#    - name: Install Intel oneAPI compiler
#      if: contains( matrix.compiler, 'intel' )
#      run: |
#        ${ATLAS_TOOLS}/install-intel-oneapi.sh
#        source /opt/intel/oneapi/setvars.sh
#        printenv >> $GITHUB_ENV
#        
#        printenv

    - name: Set Build & Test Environment
      run: |
        set -x
        set +e
        echo $PATH
        echo $FC
        echo $CC
        echo $CXX
        echo ${{ env.FC }}
        #ls -l /opt/intel/oneapi
        #ls -l /opt/intel/oneapi/compiler/
        #ls -l /opt/intel/oneapi/basekit/
        #ls -l /opt/intel/oneapi/hpckit/
        #ls -l /opt/intel/oneapi/compiler/2023.2.2
        #ls -l /opt/intel/oneapi/compiler/2023.2.2/linux
        #ls -l /opt/intel/oneapi/compiler/2023.2.2/linux/bin
        #ls -l /opt/intel/oneapi/compiler/2023.2.2/linux/bin/intel64
        which icx
        which icpx
        which ifx
        which icc
        which icpc
        which ifort
